<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Song</title>
<style>
  :root{
    --bg-deep:#1c1c1c;
    --violet-1:#1f3d2e;
    --violet-2:#2f8f5b;
    --violet-glow:#4ade80;
    --teal:#22c55e;
    --teal-bright:#1DB954;
    --spotify:#1DB954;
    --spotify-bright:#1ed760;
    --card-dark:rgba(28,28,28,0.92);
    --text-dim:#d4d4d4;
    --text-faint:#8a8a8a;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:2rem 1.25rem;
    background: var(--bg-deep);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    color:#fff;
  }

  .container{
    width:100%;
    max-width:420px;
  }

  .eyebrow{
    text-align:center;
    font-size:1.9rem;
    font-weight:800;
    letter-spacing:-0.01em;
    margin-bottom:0.35rem;
    color:var(--teal-bright);
  }

  .subtitle{
    text-align:center;
    font-size:0.95rem;
    color:var(--text-dim);
    margin-bottom:1.5rem;
  }

  /* ---- card ---- */
  .card{
    position:relative;
    overflow:hidden;    background:linear-gradient(160deg, #2b2b2b 0%, #202020 55%, #161616 100%);
  }

  .art-zone{
    border-radius:16px;
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
  }
  .art-zone::before{
    content:'';
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
  }

  .art-slab{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
  }

  /* ---- info panel ---- */
  .info{
    position:relative;
    background:var(--card-dark);
    padding:1.5rem 1.5rem 1.6rem;
    border-top:1px solid rgba(255,255,255,0.05);
  }

  .kicker{
    font-size:0.8rem;
    letter-spacing:0.06em;
    color:var(--teal);
    font-weight:600;
    text-transform:uppercase;
    margin-bottom:8px;
  }

  .song-name{
    font-size:1.7rem;
    font-weight:800;
    letter-spacing:-0.01em;
    line-height:1.25;
    color:#ffffff;
    margin-bottom:6px;
    overflow-wrap:break-word;
    white-space:normal;
  }

  .artists{
    text-align:center;  
    color:var(--text-dim);
    font-size:1.2rem;
    font-weight:500;
    margin-top:1.5rem;
    margin-bottom:1.5rem;
    overflow-wrap:break-word;
    white-space:normal;
  }

  .quote{
    font-size:0.9rem;
    color:#dcf5e4;
    font-style:italic;
    line-height:1.5;
    border-left:2px solid var(--violet-2);
    padding-left:11px;
    margin-bottom:18px;
  }

  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:1.3rem;
  }
  .pill{
    font-size:0.75rem;
    font-weight:600;
    padding:5px 13px;
    border-radius:999px;
    background:rgba(74,222,128,0.14);
    color:#bdf5cf;
    border:1px solid rgba(74,222,128,0.25);
  }
  .pill.year{
    background:rgba(255,255,255,0.1);
    color:#ffffff;
    border-color:rgba(255,255,255,0.22);
  }

  .listen-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    background:linear-gradient(145deg, var(--spotify-bright), var(--spotify));
    color:#04150a;
    text-decoration:none;
    padding:0.95rem 1rem;
    border-radius:14px;
    font-weight:800;
    font-size:1rem;
    letter-spacing:0.01em;
    box-shadow:0 10px 24px rgba(29,185,84,0.3);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .listen-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 28px rgba(29,185,84,0.4);
  }
  .listen-btn svg{ width:18px; height:18px; }

  .date-line{
    text-align:center;
    color:var(--text-faint);
    font-size:1rem;
    margin-top:1rem;
  }

  /* ---- states ---- */
  .loading, .error{
    text-align:center;
    padding:3rem 1rem;
    font-size:0.95rem;
  }
  .loading{ color:var(--text-dim); }
  .loading::after{
    content:'';
    animation:dots 1.4s steps(4,end) infinite;
  }
  @keyframes dots{
    0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';}
  }
  .error{ color:#f38ba8; }
</style>
</head>
<body>
<div class="container">
  <div class="eyebrow">Daily Song</div>
  <div class="subtitle">A different song every day</div>

  <div class="card">
    <div class="art-zone">
      <div class="art-slab" id="art-slab"></div>
    </div>

    <div class="info" id="content">
      <p class="loading">Loading today's song</p>
    </div>
  </div>
</div>

<script>
const content = document.getElementById('content');
const artSlab = document.getElementById('art-slab');

async function loadSong() {
  try {
    const res = await fetch('data/today.json');
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Failed to load song');
    }
    const song = await res.json();

    if (song.image) {
      artSlab.style.backgroundImage = `url(${song.image})`;
    }

    content.innerHTML = `
      <div class="song-name" title="${song.name}">${song.name}</div>
      <div class="artists" title="${song.artists}">${song.artists}</div>

      ${song.tagline ? `<div class="quote">"${song.tagline}"</div>` : ''}

      ${song.tags ? `<div class="pills">${song.tags.map((t,i) => `<span class="pill${i === song.tags.length-1 ? ' year' : ''}">${t}</span>`).join('')}</div>` : ''}

      <a class="listen-btn" href="${song.url}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.59 14.42c-.19.31-.59.41-.9.22-2.47-1.51-5.58-1.85-9.24-1.01-.35.08-.7-.14-.78-.49-.08-.35.14-.7.49-.78 4-.91 7.44-.52 10.21 1.16.31.19.41.6.22.9zm1.22-2.73c-.24.39-.75.51-1.14.27-2.83-1.74-7.14-2.24-10.49-1.23-.44.13-.9-.12-1.03-.55-.13-.44.12-.9.55-1.03 3.82-1.16 8.57-.6 11.84 1.4.39.24.51.75.27 1.14zm.11-2.84C14.36 8.6 9.7 8.44 6.9 9.3c-.52.16-1.08-.14-1.24-.66-.16-.52.14-1.08.66-1.24 3.24-.98 8.42-.79 11.74 1.19.47.28.62.89.34 1.36-.28.47-.89.62-1.36.34z"/></svg>
        Listen on Spotify
      </a>

      ${song.date ? `<div class="date-line">${song.date}</div>` : ''}
    `;
  } catch (err) {
    content.innerHTML = `<p class="error">${err.message}</p>`;
  }
}

loadSong();
</script>
</body>
</html>
